create_task:
  name: Create task
  description: Creates a new task in the Smart Todo list.
  fields:
    title:
      name: Title
      description: Task title.
      required: true
      example: "Take out trash"
      selector:
        text:
    notes:
      name: Notes
      description: Optional notes or description.
      example: "Remember bags"
      selector:
        text:
          multiline: true
    due_at:
      name: Due
      description: Due date/time as ISO 8601 string.
      example: "2026-06-01T09:00:00"
      selector:
        text:
    priority:
      name: Priority
      description: "1=low, 2=medium, 3=high"
      default: 2
      selector:
        number:
          min: 1
          max: 3
          mode: box
    assignee:
      name: Assignee
      description: Optional assignee name.
      example: "Jesper"
      selector:
        text:
    recurrence:
      name: Recurrence
      description: Recurrence rule as a dict (mode, interval_days, weekdays, etc.)
      selector:
        object:
    points:
      name: Points
      description: Optional reward points earned when this task is completed.
      default: 0
      example: 5
      selector:
        number:
          min: 0
          mode: box
    reward_recipient:
      name: Reward recipient
      description: >-
        Free-text name of who earns the points on completion. Falls back to
        assignee if omitted. Does not require a Home Assistant account.
      example: "Mina"
      selector:
        text:
    # Anchor defined once here; every other service below reuses it via a
    # YAML alias (*config_entry_id_field) instead of repeating the block.
    config_entry_id: &config_entry_id_field
      name: List
      description: "Which Smart Todo list to target. Only needed if you have more than one."
      selector:
        config_entry:
          integration: smart_todo

complete_task:
  name: Complete task
  description: Marks a task completed and triggers recurrence recalculation.
  fields:
    task_id:
      name: Task ID
      description: Unique task identifier (UUID).
      required: true
      example: "abc-123"
      selector:
        text:
    config_entry_id: *config_entry_id_field

reopen_task:
  name: Reopen task
  description: Reopens a completed task.
  fields:
    task_id:
      name: Task ID
      description: Unique task identifier.
      required: true
      selector:
        text:
    config_entry_id: *config_entry_id_field

update_task:
  name: Update task
  description: Updates one or more fields of an existing task.
  fields:
    task_id:
      name: Task ID
      description: Unique task identifier.
      required: true
      selector:
        text:
    title:
      name: Title
      description: New title.
      selector:
        text:
    notes:
      name: Notes
      description: New notes.
      selector:
        text:
          multiline: true
    due_at:
      name: Due
      description: New due date/time as ISO 8601.
      selector:
        text:
    priority:
      name: Priority
      description: "1=low, 2=medium, 3=high"
      selector:
        number:
          min: 1
          max: 3
          mode: box
    assignee:
      name: Assignee
      description: New assignee name.
      selector:
        text:
    recurrence:
      name: Recurrence
      description: Updated recurrence rule as a dict.
      selector:
        object:
    points:
      name: Points
      description: New reward points value for this task.
      example: 5
      selector:
        number:
          min: 0
          mode: box
    reward_recipient:
      name: Reward recipient
      description: New reward recipient name (free text; falls back to assignee).
      example: "Mina"
      selector:
        text:
    config_entry_id: *config_entry_id_field

snooze_task:
  name: Snooze task
  description: Snoozes a task until a specified date/time.
  fields:
    task_id:
      name: Task ID
      description: Unique task identifier.
      required: true
      selector:
        text:
    snooze_until:
      name: Snooze until
      description: Snooze until this date/time (ISO 8601).
      required: true
      example: "2026-06-02T08:00:00"
      selector:
        text:
    config_entry_id: *config_entry_id_field

delete_task:
  name: Delete task
  description: Permanently deletes a task.
  fields:
    task_id:
      name: Task ID
      description: Unique task identifier.
      required: true
      selector:
        text:
    config_entry_id: *config_entry_id_field

recalculate_recurrence:
  name: Recalculate recurrence
  description: Recalculates due dates for recurring tasks.
  fields:
    task_id:
      name: Task ID
      description: "Optional. If omitted, recalculates all tasks."
      selector:
        text:
    config_entry_id: *config_entry_id_field

get_tasks:
  name: Get tasks
  description: Returns full task list with all fields as service response data.
  fields:
    overdue_only:
      name: Overdue only
      description: If true, return only overdue tasks.
      default: false
      selector:
        boolean:
    assignee:
      name: Assignee filter
      description: Filter by assignee name.
      selector:
        text:
    priority:
      name: Priority filter
      description: "Filter by priority: 1, 2, or 3."
      selector:
        number:
          min: 1
          max: 3
          mode: box
    completed:
      name: Completed filter
      description: "true = completed only, false = incomplete only, omit = all."
      selector:
        boolean:
    config_entry_id: *config_entry_id_field

purge_completed:
  name: Purge completed tasks
  description: Permanently deletes all completed non-recurring tasks.
  fields:
    config_entry_id: *config_entry_id_field

spend_points:
  name: Spend points
  description: Deducts points from a recipient's balance in exchange for a reward.
  fields:
    recipient:
      name: Recipient
      description: Who is spending points. Must match the configured roster if one is set.
      required: true
      example: "Mina"
      selector:
        text:
    amount:
      name: Amount
      description: How many points to deduct. Cannot exceed the current balance.
      required: true
      example: 20
      selector:
        number:
          min: 1
          mode: box
    note:
      name: Spent on
      description: Optional free-text note describing what the points were spent on.
      example: "30 min extra screen time"
      selector:
        text:
    config_entry_id: *config_entry_id_field
