[pytest]
# Without this, pytest-asyncio (pulled in by pytest-homeassistant-custom-component)
# requires an explicit @pytest.mark.asyncio on every async test function —
# omit either and the async test body silently never runs (a false-positive
# pass, not a failure). test_coordinator_integration.py's tests are plain
# `async def test_...(hass):` with no decorator, matching Home Assistant's
# own test convention, so this must be set globally.
asyncio_mode = auto
